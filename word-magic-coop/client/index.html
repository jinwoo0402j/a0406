<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>단어로 만드는 마법</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/client/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- 로비: 글은 제목·연결 오류만, 나머지는 기호 -->
  <section id="lobby" class="screen">
    <div class="card">
      <h1>단어로 만드는 마법</h1>
      <div class="seats" aria-label="참가 자리 (최대 6명)"></div>
      <p id="lobby-status" class="status"></p>
      <p id="lobby-note" class="note" hidden></p>
      <div class="lobby-actions">
        <button id="join-btn" type="button" title="참가"><i data-ic="in"></i></button>
        <button id="create-btn" type="button" hidden title="방 만들기"><i data-ic="people"></i><i data-ic="plus"></i></button>
        <button id="solo-btn" type="button" class="secondary" title="혼자 해보기"><i data-ic="play"></i></button>
      </div>
      <form id="join-form" class="join-form" hidden>
        <label for="join-code" title="친구 방에 들어가기"><i data-ic="in"></i></label>
        <input id="join-code" name="join-code" type="text" inputmode="latin" autocomplete="off" spellcheck="false" maxlength="6" placeholder="abc234" aria-label="방 코드 6자리">
        <button id="join-code-btn" type="submit" class="secondary" title="참가"><i data-ic="arrow"></i></button>
      </form>
      <div id="room-info" class="room-info" hidden>
        <div class="room-code"><i data-ic="people"></i><strong id="room-code"></strong></div>
        <div class="room-link"><code id="room-link"></code><button id="copy-link" type="button" class="ghost" title="링크 복사"><i data-ic="copy"></i></button></div>
        <p class="note icons-line"><i data-ic="link"></i><i data-ic="arrow"></i><i data-ic="people"></i> ≤6</p>
      </div>
      <div id="lobby-address" class="address" hidden></div>
      <details class="howto">
        <summary title="조작법"><i data-ic="help"></i></summary>
        <div id="howto-keys" class="howto-keys"></div>
        <table id="howto-modes" class="modes"></table>
      </details>
    </div>
  </section>

  <!-- 게임 HUD -->
  <section id="hud" hidden>
    <div id="crosshair"></div>

    <!-- 왼쪽 위: 나 · 대상 모드 · 지금 주문 · 미리보기(기호 위주) -->
    <div id="spell" class="panel">
      <div class="who"><span id="who-chip"></span><span id="mode-chips" class="mode-chips"></span><kbd class="kc">F</kbd><span id="view-chip" class="view-chip"></span></div>
      <div id="spell-line" class="sentence"></div>
      <div id="preview-note" class="preview-note"></div>
    </div>

    <!-- 가운데 위: 도착 목표 -->
    <div id="goal" class="panel">
      <div class="goal-row"><span id="goal-flag" class="goal-flag"></span><div id="goal-items" class="goal-items"></div></div>
      <div class="goal-bar"><div id="goal-fill"></div></div>
    </div>
    <div id="guide" hidden></div>

    <ul id="log"></ul>

    <!-- 아래 가운데(PEAK처럼): 상태 막대(재사용 대기 + 상태 기호) 위에 핫바 -->
    <div id="status"><div class="cooldown"><div id="cooldown-bar"></div></div><div id="badges"></div></div>
    <div id="hotbar"></div>
    <div id="prompt"></div>
    <div id="toast"></div>

    <div id="keys"></div>

    <div id="lock-hint"></div>

    <div id="clear-banner" hidden>
      <div id="clear-icons" class="big"></div>
      <div id="clear-stats"></div>
    </div>
  </section>

  <!-- 가방(마인크래프트식 인벤토리) -->
  <section id="editor" hidden>
    <div id="mc-panel" class="mc-panel">
      <div class="mc-title" title="주문"><i data-ic="wand"></i></div>
      <div class="mc-spell">
        <div class="mc-col"><div id="mc-hand-label" class="mc-label"><i data-ic="hand"></i></div><div id="mc-hand" class="mc-slot hand" data-area="hand"></div></div>
        <div class="mc-op"><i data-ic="plus"></i></div>
        <div class="mc-col"><div class="mc-label"><i data-ic="big"></i><i data-ic="strong"></i></div><div id="mc-mods" class="mc-row"></div></div>
        <div class="mc-op"><i data-ic="arrow"></i></div>
        <div class="mc-col grow"><div class="mc-label"><i data-ic="star"></i></div><div id="mc-result" class="mc-result"></div></div>
      </div>
      <div class="mc-title" title="가방"><i data-ic="bag"></i></div>
      <div id="mc-main" class="mc-grid"></div>
      <div id="mc-hot" class="mc-grid mc-hotrow"></div>
      <div class="mc-help">
        <span><i data-ic="mouseL"></i><i data-ic="grab"></i></span>
        <span><i data-ic="mouseR"></i><i data-ic="half"></i></span>
        <span><kbd class="kc">Shift</kbd>+<i data-ic="mouseL"></i><i data-ic="swap"></i></span>
        <span><kbd class="kc">1~9</kbd><i data-ic="swap"></i></span>
        <span><kbd class="kc">Q</kbd><i data-ic="throw"></i></span>
        <span title="끌어서 나누기"><i data-ic="mouseL"></i><i data-ic="split"></i></span>
        <span title="끌어서 하나씩"><i data-ic="mouseR"></i><i data-ic="dots"></i></span>
        <span title="두 번 클릭: 모으기"><i data-ic="mouseL"></i><i data-ic="mouseL"></i><i data-ic="gather"></i></span>
      </div>
      <details id="summary-box" class="summary-box">
        <summary title="판 요약"><i data-ic="clock"></i></summary>
        <pre id="summary-text"></pre>
        <button type="button" id="summary-copy" class="ghost"><i data-ic="copy"></i></button>
      </details>
      <div class="editor-actions">
        <button type="button" id="restart-btn" class="danger" title="처음부터 다시 (모두)"><i data-ic="restart"></i> <i data-ic="people"></i></button>
        <button type="button" id="close-editor" title="닫기"><kbd class="kc">E</kbd> <i data-ic="close"></i></button>
      </div>
    </div>
    <div id="mc-cursor" class="mc-cursor"></div>
    <div id="mc-tip" class="mc-tip" hidden></div>
  </section>

  <script type="module" src="/client/main.js"></script>
</body>
</html>
